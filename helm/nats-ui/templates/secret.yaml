{{- if not .Values.existingSecret }}
{{- /*
  Generate strong secrets when none are supplied, reusing whatever the existing
  Secret already holds so an upgrade does not rotate JWT_SECRET and log every
  session out.
*/ -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "nats-ui.fullname" .)) -}}
{{- $existingData := (default dict (get (default dict $existing) "data")) -}}
{{- $jwtSecret := .Values.secrets.jwtSecret -}}
{{- if not $jwtSecret -}}
  {{- $jwtSecret = (b64dec (default (b64enc (randAlphaNum 48)) (get $existingData "JWT_SECRET"))) -}}
{{- end -}}
{{- $adminPass := .Values.secrets.adminPass -}}
{{- if not $adminPass -}}
  {{- $adminPass = (b64dec (default (b64enc (randAlphaNum 24)) (get $existingData "ADMIN_PASS"))) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nats-ui.fullname" . }}
  labels:
    {{- include "nats-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  NATS_PASS: {{ .Values.secrets.natsPass | quote }}
  ADMIN_PASS: {{ $adminPass | quote }}
  JWT_SECRET: {{ $jwtSecret | quote }}
  {{- if .Values.oauth2.google.clientID }}
  GOOGLE_CLIENT_ID: {{ .Values.oauth2.google.clientID | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.oauth2.google.clientSecret | quote }}
  {{- end }}
  {{- if .Values.oauth2.github.clientID }}
  GITHUB_CLIENT_ID: {{ .Values.oauth2.github.clientID | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.oauth2.github.clientSecret | quote }}
  {{- end }}
  {{- if .Values.oauth2.keycloak.clientID }}
  KEYCLOAK_CLIENT_ID: {{ .Values.oauth2.keycloak.clientID | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.oauth2.keycloak.clientSecret | quote }}
  {{- end }}
  {{- if .Values.oauth2.oidc.clientID }}
  OIDC_CLIENT_ID: {{ .Values.oauth2.oidc.clientID | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.oauth2.oidc.clientSecret | quote }}
  {{- end }}
{{- end }}
