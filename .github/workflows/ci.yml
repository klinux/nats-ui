name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Version comes from the "packageManager" field in frontend/package.json.
      # Do not use pnpm@latest: an unpinned upgrade broke CI once already.
      - name: Install pnpm
        working-directory: frontend
        run: corepack enable && pnpm --version

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      # Palette classes bypass the theme tokens entirely, which is how the UI
      # ended up with colour that no theme change could reach. Semantic state
      # belongs in --state-* / --destructive, not in bg-red-600.
      - name: No hardcoded palette colours
        working-directory: frontend
        run: |
          if grep -rEn "(bg|text|border|fill|stroke)-(red|green|yellow|blue|orange|purple|emerald|amber|rose|cyan|indigo|violet|teal|lime|pink|sky)-[0-9]{2,3}" src --include='*.tsx'; then
            echo "::error::Use semantic tokens (state-ok / state-warn / state-crit / destructive / primary) instead of Tailwind palette classes."
            exit 1
          fi

      - name: Test
        working-directory: frontend
        run: pnpm test

      - name: Build
        working-directory: frontend
        run: pnpm build
